<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; manifest-src 'self'; worker-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://api.qrserver.com; connect-src ws://127.0.0.1:*; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>QR Codes — Deep Talks</title>
  <link rel="icon" href="images/favicon.webp" type="image/webp" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />
  <meta name="theme-color" content="#2b5c44" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Deep Talks" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="qr-page">

  <div id="qr-app">

    <!-- Single badge: lives outside the views so it survives view transitions -->
    <div id="qr-badge">
      <img src="images/deeptalks-logo.webp" alt="Deep Talks" id="qr-badge-logo" />
      <span class="qr-badge-sub">Deep Talks</span>
      <span class="qr-badge-main">QR Codes</span>
    </div>

    <div class="qr-views">

      <!-- DISPLAY -->
      <div id="view-display" class="qr-view" aria-hidden="true">
        <div class="qr-grid" id="qr-grid">
          <!-- .qr-card elements injected by JS at grid corners -->
        </div>
        <div class="qr-nav">
          <a href="index.html" class="rnd-btn-sq" aria-label="Exit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16,17 21,12 16,7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </a>
          <button id="btn-to-edit" class="rnd-btn-sq" aria-label="Edit QR codes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- EDIT -->
      <div id="view-edit" class="qr-view" aria-hidden="true">
        <p class="rnd-instruction">Enter a URL for each slot. Names are optional — if blank the slot number shows instead.</p>
        <div class="rnd-actions">
          <button id="btn-edit-back"  class="rnd-btn rnd-btn--sm rnd-btn--ghost">Back</button>
          <button id="btn-edit-clear" class="rnd-btn rnd-btn--sm rnd-btn--ghost">Clear</button>
          <button id="btn-edit-save"  class="rnd-btn rnd-btn--sm">Save</button>
        </div>
        <div class="qr-form">
          <div class="qr-slot">
            <span class="qr-slot-num">1</span>
            <input type="text" class="qr-input-name" placeholder="Name (optional)" />
            <input type="text" class="qr-input-url"  placeholder="https://..." />
          </div>
          <div class="qr-slot">
            <span class="qr-slot-num">2</span>
            <input type="text" class="qr-input-name" placeholder="Name (optional)" />
            <input type="text" class="qr-input-url"  placeholder="https://..." />
          </div>
          <div class="qr-slot">
            <span class="qr-slot-num">3</span>
            <input type="text" class="qr-input-name" placeholder="Name (optional)" />
            <input type="text" class="qr-input-url"  placeholder="https://..." />
          </div>
          <div class="qr-slot">
            <span class="qr-slot-num">4</span>
            <input type="text" class="qr-input-name" placeholder="Name (optional)" />
            <input type="text" class="qr-input-url"  placeholder="https://..." />
          </div>
        </div>
      </div>

    </div>
  </div>

  <button id="btn-fullscreen" aria-label="Toggle fullscreen">
    <svg id="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15,3 21,3 21,9"/>
      <polyline points="9,21 3,21 3,15"/>
      <line x1="21" y1="3" x2="14" y2="10"/>
      <line x1="3" y1="21" x2="10" y2="14"/>
    </svg>
    <svg id="icon-compress" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <polyline points="4,14 10,14 10,20"/>
      <polyline points="20,10 14,10 14,4"/>
      <line x1="10" y1="14" x2="3" y2="21"/>
      <line x1="21" y1="3" x2="14" y2="10"/>
    </svg>
  </button>

  <script src="js/qr.js"></script>
</body>
</html>
