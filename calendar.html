<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; manifest-src 'self'; worker-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://api.qrserver.com; connect-src https://docs.google.com ws://127.0.0.1:*; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Past Topics — Deep Talks</title>
  <!-- Open Graph / Social sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Calendar — Deep Talks" />
  <meta property="og:description" content="Group circle discussions in Canggu, Bali. A community for meaningful conversations." />
  <meta property="og:url" content="https://deeptalkscanggu.github.io/calendar.html" />
  <meta property="og:image" content="https://deeptalkscanggu.github.io/images/deeptalks-green.webp" />
  <link rel="icon" href="images/favicon.webp" type="image/webp" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />
  <meta name="theme-color" content="#2b5c44" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Deep Talks" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .topics-header {
      display: grid;
      grid-template-columns: 130px 1fr 1fr;
      gap: 1rem;
      padding: 0.6rem 1.5rem;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--grey-mid);
      border-bottom: 1px solid rgba(200,230,201,0.3);
      margin-top: 2.5rem;
    }
    .past-page-hero {
      background: #f2f2f2;
      background-image: none;
      min-height: 200px;
      padding: calc(60px + 2.5rem) 2rem 2.5rem;
      margin-top: 0;
      justify-content: center;
      text-align: center;
      align-items: center;
    }
    .page-hero.past-page-hero .page-hero-eyebrow {
      color: var(--grey-dark);
      margin-bottom: 0.85rem;
    }
    .page-hero.past-page-hero h1 {
      color: var(--grey-dark);
    }
    @media (min-width: 980px) {
      .page-hero.past-page-hero {
        text-align: center;
        align-items: center;
        padding-left: 0;
      }
      .page-hero.past-page-hero .page-hero-eyebrow,
      .page-hero.past-page-hero h1 {
        max-width: 720px;
      }
    }
    @media (max-width: 979px) {
      .page-hero.past-page-hero {
        min-height: 160px;
        padding: calc(60px + 2rem) 2rem 2rem;
      }
    }
    .content-section > .btn-outline {
      margin: 1rem 0 1.5rem;
      display: inline-block;
    }
    .topic-row {
      display: grid;
      grid-template-columns: 130px 1fr 1fr;
      gap: 1rem;
      align-items: start;
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid rgba(200,230,201,0.2);
      transition: background 0.2s;
      animation: fadeUp 0.5s ease both;
    }
    .topic-row:hover { background: rgba(200,230,201,0.1); }
    .topic-date {
      font-size: 0.78rem;
      color: var(--green-dark);
      font-variant-numeric: tabular-nums;
      padding-top: 3px;
    }
    .topic-subject {
      font-family: 'Times New Roman', serif;
      font-size: 1.2rem;
      font-weight: 400;
      color: var(--grey-dark);
      line-height: 1.3;
    }
    .topic-host {
      font-size: 0.73rem;
      color: var(--green-dark);
      letter-spacing: 0.04em;
      margin-top: 4px;
    }
    .topic-explanation {
      font-size: 0.82rem;
      color: var(--green-dark);
      line-height: 1.6;
    }
.loading-state, .error-state, .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--green-dark);
      font-size: 0.9rem;
    }
    .loading-state .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(200,230,201,0.3);
      border-top-color: var(--green-dark);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    .error-state { color: #e07070; }
    .count-badge {
      font-size: 0.72rem;
      color: var(--green-dark);
      letter-spacing: 0.08em;
      margin-top: 0.4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .year-banner {
      background: rgba(140, 195, 158, 1);
      text-align: center;
      color: black;
      padding: 0.5rem 1rem;
      font-size: 1.2rem;
      font-weight: bold;
      margin: 1rem 0;
      border-radius: 4px;
    }
    @media (max-width: 680px) {
      .topics-header { display: none; }
      .topic-row {
        grid-template-columns: 1fr;
        gap: 0.4rem;
      }
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0.75rem 0 1.5rem;
    }
    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.75rem;
      border: 1px solid rgba(140, 195, 158, 0.5);
      border-radius: 999px;
      background: rgba(140, 195, 158, 0.1);
      color: var(--green-dark);
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
      user-select: none;
    }
    .filter-btn:hover {
      background: rgba(140, 195, 158, 0.22);
      border-color: rgba(140, 195, 158, 0.7);
    }
    .filter-btn.hidden-filter {
      opacity: 0.4;
      text-decoration: line-through;
      background: transparent;
    }
    .topic-row.filtered-out {
      display: none;
    }
  </style>

</head>
<body>

  <nav id="nav-root"></nav>

  <section class="page-hero past-page-hero">
    <p class="page-hero-eyebrow">Timeline</p>
    <h1>Past & Future Topics</h1>
  </section>

  <div class="content-section" style="max-width: 1000px;">
    <h2>What we've explored</h2>
    <p>Every session has a distinct topic, here's a full timeline since 2023.</p>
    <p class="count-badge" id="topic-count"></p>
    <p style="font-size:0.8rem; color:var(--green-dark); margin: 1.25rem 0 0.4rem;">Click to filter out:</p>
    <div class="filter-bar" id="filter-bar"></div>

    <div class="topics-header">
      <span>Date</span>
      <span>Subject</span>
      <span>Summary</span>
      <span></span>
    </div>

    <div id="topics-container">
      <div class="loading-state">
        <div class="spinner"></div>
        Fetching past topics…
      </div>
    </div>
  </div>

  <footer id="footer-root"></footer>

  <script src="js/calendar.js"></script>
  <script src="js/components.js"></script>
</body>
</html>
