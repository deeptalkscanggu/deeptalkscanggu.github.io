<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; manifest-src 'self'; worker-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://api.qrserver.com; connect-src https://docs.google.com ws://127.0.0.1:*; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Deep Talks</title>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Gallery — Deep Talks" />
  <meta property="og:description" content="Photos from Deep Talks sessions in Canggu, Bali." />
  <meta property="og:url" content="https://deeptalkscanggu.github.io/gallery.html" />
  <meta property="og:image" content="https://deeptalkscanggu.github.io/images/deeptalks-green.webp" />
  <link rel="icon" href="images/favicon.webp" type="image/webp" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />
  <meta name="theme-color" content="#2b5c44" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Deep Talks" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .gallery-hero {
      background: #f2f2f2;
      background-image: none;
      min-height: 200px;
      padding: calc(60px + 2.5rem) 2rem 2.5rem;
      justify-content: center;
      text-align: center;
      align-items: center;
    }
    .page-hero.gallery-hero .page-hero-eyebrow { color: var(--grey-dark); margin-bottom: 0.85rem; }
    .page-hero.gallery-hero h1 { color: var(--grey-dark); }

    @media (max-width: 979px) {
      .page-hero.gallery-hero { min-height: 160px; padding: calc(60px + 2rem) 2rem 2rem; }
    }

    .gallery-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    .gallery-grid {
      columns: 3;
      column-gap: 10px;
    }

    @media (max-width: 800px) { .gallery-grid { columns: 2; } }
    @media (max-width: 480px) { .gallery-grid { columns: 1; } }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 10px;
      overflow: hidden;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .gallery-item:hover { transform: scale(1.02); box-shadow: 0 6px 20px rgba(0,0,0,0.18); }

    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .gallery-item img.loaded {
      opacity: 1;
    }

    .gallery-ig-note {
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--grey-soft);
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .gallery-ig-note a { color: var(--green-dark); text-decoration: none; }
    .gallery-ig-note a:hover { text-decoration: underline; }

    .gallery-empty {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--grey-soft);
      font-size: 0.95rem;
    }

    .gallery-pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.4rem;
      padding: 2.5rem 0 1rem;
      flex-wrap: wrap;
    }

    .gallery-pagination button {
      min-width: 2.4rem;
      height: 2.4rem;
      padding: 0 0.6rem;
      border: 1.5px solid var(--green-dark, #2d6a4f);
      background: transparent;
      color: var(--green-dark, #2d6a4f);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
    }
    .gallery-pagination button:hover { background: var(--green-dark, #2d6a4f); color: #fff; }
    .gallery-pagination button.active { background: var(--green-dark, #2d6a4f); color: #fff; pointer-events: none; }
    .gallery-pagination button:disabled { opacity: 0.35; pointer-events: none; }
    .gallery-pagination .pg-dots { color: var(--grey-soft, #aaa); font-size: 0.9rem; padding: 0 0.2rem; line-height: 2.4rem; }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
    }
    .lightbox.open { display: flex; }

    .lightbox-img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 4px;
      display: block;
    }

    .lightbox-close {
      position: fixed;
      top: 1rem;
      left: 1rem;
      width: 2.4rem;
      height: 2.4rem;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      color: #fff;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 201;
    }
    .lightbox-close:hover { background: rgba(255,255,255,0.25); }
  </style>

</head>
<body>

  <nav id="nav-root"></nav>

  <section class="page-hero gallery-hero">
    <p class="page-hero-eyebrow">Deep Talks</p>
    <h1>Gallery</h1>
  </section>

  <div class="gallery-section">
    <p class="gallery-ig-note">View more on <a href="https://www.instagram.com/deeptalkscanggu/" target="_blank" rel="noopener noreferrer">@deeptalkscanggu ↗</a></p>
    <div class="gallery-grid" id="gallery-grid"></div>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">&#x2715;</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="" />
  </div>

  <script src="js/gallery.js"></script>
  <script src="js/components.js"></script>
</body>
</html>
